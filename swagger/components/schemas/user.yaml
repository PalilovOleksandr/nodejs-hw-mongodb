type: object
required:
  - name
  - email
  - _id
properties:
  name:
    description: 'User name'
    type: string
    example: Palilov Oleksandr
  email:
    description: 'Unique user email'
    type: string
    example: opalilovit@gmail.com
  _id:
    description: 'Unique user id'
    type: string
    example: 65ca67e7ae7f10c88b598384
