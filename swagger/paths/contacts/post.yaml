tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create contact'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: 'Contact name'
            type: string
            example: Palilov Oleksandr
          phoneNumber:
            description: 'Phone number contact'
            type: string
            example: '+380000000004'
          email:
            description: 'Email contact'
            type: string
            example: 'opalilovit@gmail.com'
          isFavourite:
            description: 'Is it a favorite contact'
            type: boolean
            example: false
          contactType:
            description: 'Type of contact'
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: Link to contact`s photo
            type: string
            format: binary
responses:
  '201':
    description: 'Create contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: '../../components/responses/401Contact.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
