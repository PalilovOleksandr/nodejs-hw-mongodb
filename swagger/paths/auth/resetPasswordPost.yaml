tags:
  - Auth
summary: Reset password
operationId: resetPassword
description: 'password update for a specific user'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            description: 'JWT created when attempting to change password'
            type: string
            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2OGE0OGFhMjExYzM4NGI3MTBmMzc1YzEiLCJlbWFpbCI6Im9wYWxpbG92aXRAZ21haWwuY29tIiwiaWF0IjoxNzU2MzAxMzUxLCJleHAiOjE3NTYzMDE2NTF9.ey30Oofce5NS9BtCzdz-bv1UI2Gx9gNZW_wnPNz8Zx4
          password:
            description: 'New password'
            type: string
            example: agajsif228830
responses:
  '200':
    description: 'Password update for a specific user'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset.
            data:
              type: object
  '401':
    $ref: '../../components/responses/401User.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
