tags:
  - Auth
summary: Send letter on email
operationId: sendResetEmail
description: 'Send a letter to change your password'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            description: 'Email address for sending letters'
            type: string
            example: opalilovit@gmail.com
responses:
  '200':
    description: 'Send letter on email'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email has been successfully sent.
            data:
              type: object
  '404':
    $ref: '../../components/responses/401User.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
